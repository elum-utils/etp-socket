name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v0.0.1
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out package
        uses: actions/checkout@v6
        with:
          path: etp-socket
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set package version from tag
        working-directory: etp-socket
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must be a SemVer value with v prefix" >&2
            exit 1
          fi
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
            echo "Release tag is not a canonical SemVer value: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: etp-socket
        run: npm ci

      - name: Validate package
        working-directory: etp-socket
        run: |
          npm run check
          npm test
          npm run build
          npm pack --dry-run

      - name: Publish package
        working-directory: etp-socket
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            npm publish --access public --provenance
          fi
          npm access set status public "$PACKAGE_NAME"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
